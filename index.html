<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Neue Videoanalyse</title>
  <link rel="icon" type="image/city" href="/images/city.png">

  <style>
    /* =========================
       Basis
       ========================= */

    *,
    *::before,
    *::after {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        padding: 0;
        min-height: 100%;
    }

    body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #111;
        color: #fff;
    }


    /* =========================
       Layout
       ========================= */

    .app {
        width: min(900px, 100%);
        margin: 0 auto;
        padding: 24px;
    }

    h1 {
        margin: 0 0 8px;
        font-size: 24px;
        line-height: 1.25;
    }

    .subtitle {
        margin: 0 0 20px;
        color: #aaa;
        line-height: 1.5;
    }


    /* =========================
       Upload
       ========================= */

    .upload {
        display: block;
        width: 100%;
        margin-bottom: 20px;
        padding: 30px 20px;

        border: 2px dashed #444;
        border-radius: 16px;

        background: #181818;
        text-align: center;

        cursor: pointer;
        transition: border-color 0.2s ease;
    }

    .upload:hover {
        border-color: #777;
    }

    .upload-text {
        color: #888;
    }

    input[type="file"] {
        display: none;
    }


    /* =========================
       Video
       ========================= */

    video {
        display: block;
        width: 100%;
        max-width: 100%;
        max-height: 500px;

        background: #000;
        border-radius: 14px;

        object-fit: contain;
    }


    /* =========================
       Buttons
       ========================= */

    .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;

        margin: 15px 0;
    }

    button {
        flex: 0 0 auto;

        padding: 12px 18px;

        border: 0;
        border-radius: 10px;

        background: #fff;
        color: #111;

        font: inherit;
        font-size: 15px;

        cursor: pointer;
    }

    button:disabled {
        opacity: 0.4;
        cursor: default;
    }


    /* =========================
       Status & Progress
       ========================= */

    .status {
        min-height: 24px;
        margin: 10px 0;

        color: #aaa;
        line-height: 1.5;
    }

    .progress {
        width: 100%;
        height: 8px;
        margin-bottom: 20px;

        background: #292929;
        border-radius: 999px;

        overflow: hidden;
    }

    .progress-bar {
        width: 0%;
        height: 100%;

        background: #fff;

        transition: width 0.1s linear;
    }


    /* =========================
       Metriken
       ========================= */

    .metrics {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;

        margin-bottom: 20px;
    }

    .metric {
        min-width: 0;
        padding: 16px;

        background: #181818;
        border-radius: 14px;
    }

    .metric-label {
        margin-bottom: 5px;

        color: #aaa;
        font-size: 13px;
        line-height: 1.4;
    }

    .metric-value {
        min-width: 0;

        font-size: 28px;
        font-weight: 700;
        line-height: 1.2;

        overflow-wrap: anywhere;
    }


    /* =========================
       Chart
       ========================= */

    .chart-container {
        width: 100%;
        margin-bottom: 20px;
        padding: 15px;

        background: #181818;
        border-radius: 14px;

        overflow: hidden;
    }

    canvas.chart {
        display: block;
        width: 100%;
        max-width: 100%;
        height: 250px;
    }


    /* =========================
       Schnitte
       ========================= */

    .cuts {
        width: 100%;
        padding: 16px;

        background: #181818;
        border-radius: 14px;
    }

    .cut-list {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;

        margin-top: 10px;
    }

    .cut {
        max-width: 100%;
        padding: 7px 10px;

        background: #333;
        border-radius: 8px;

        font-size: 13px;

        overflow-wrap: anywhere;
    }

    .empty-state {
        color: #777;
    }


    /* =========================
       Info
       ========================= */

    .info {
        margin-top: 20px;

        color: #888;
        font-size: 13px;
        line-height: 1.5;
    }


    /* =========================
       Tablet / Mobile
       ========================= */

    @media (max-width: 600px) {
        .app {
            padding: 16px 12px;
        }

        h1 {
            font-size: 22px;
        }

        .upload {
            padding: 24px 16px;
        }

        video {
            max-height: 60vh;
        }

        .controls {
            flex-direction: column;
        }

        .controls button {
            width: 100%;
        }

        .metrics {
            grid-template-columns: 1fr;
        }

        .metric {
            padding: 14px;
        }

        .metric-value {
            font-size: 24px;
        }

        canvas.chart {
            height: 200px;
        }
    }


    /* =========================
       Sehr kleine Displays
       ========================= */

    @media (max-width: 380px) {
        .app {
            padding: 12px 10px;
        }

        .chart-container {
            padding: 10px;
        }

        .cuts {
            padding: 12px;
        }
    }
</style>
</head>

<body>

<div class="app">

  <h1>Neue Videoanalyse</h1>
  <div class="subtitle">
    Farbkontrast · Bewegung · Schnitte
  </div>

  <label class="upload">
    <strong>Video auswählen</strong>
    <br>
    <span style="color:#888">
      Das Video bleibt auf deinem Gerät.
    </span>
    <input id="fileInput" type="file" accept="video/*">
  </label>

  <video id="video" playsinline preload="metadata"></video>

  <div class="controls">
    <button id="analyzeBtn" disabled>
      Analyse starten
    </button>

    <button id="clearBtn" disabled>
      Zurücksetzen
    </button>
  </div>

  <div class="status" id="status">
    Noch kein Video ausgewählt.
  </div>

  <div class="progress">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <div class="metrics">
  
    
    <div class="metric">
      <div class="metric-label">Ø Farbkontrast</div>
      <div class="metric-value" id="avgContrast" style="color: #4CAF50">–</div>
    </div>

    <div class="metric">
      <div class="metric-label">Ø Bewegung</div>
      <div class="metric-value" id="avgMotion" style="color: #2196F3">–</div>
    </div>

    <div class="metric">
      <div class="metric-label">Schnitte</div>
      <div class="metric-value" id="cutCount" style="color: #FF5252">–</div>
    </div>

  </div>

  <div class="chart-container">
    <canvas id="chart" class="chart"></canvas>
  </div>

  <div class="cuts">
    <strong>Erkannte Schnitte</strong>
    <div class="cut-list" id="cutList">
      <span style="color:#777">Noch keine Analyse.</span>
    </div>
  </div>

  <div class="info">
    Die Analyse erfolgt vollständig lokal im Browser.
    Es werden keine Videodaten an einen Server übertragen.
  </div>

</div>


<script>
"use strict";

/*
  ============================================================
  Lokale Videoanalyse
  ============================================================

  Analysiert:

  1. Farbkontrast
  2. Bewegung
  3. Schnitte

  Keine externen Libraries.
  Keine Serververbindung.

  ------------------------------------------------------------
  Änderungen in dieser Version:

  - Fortschritt & Frame-Zeitstempel basieren auf der tatsächlichen
    Videoposition (video.currentTime) statt auf einer rein
    rechnerischen Zeit. Dadurch stimmt die Fortschrittsanzeige
    auch dann, wenn video.duration ungenau ist.
  - Erkennung, wenn das Video beim Seek nicht mehr vorankommt
    (z. B. weil das tatsächliche Ende schon erreicht ist, aber
    video.duration einen größeren Wert meldet). Die Analyse
    bricht dann sauber ab, statt denselben Frame endlos erneut
    zu analysieren.
  - Zusätzliche inhaltsbasierte Endeerkennung: Bei manchen
    Dateien meldet der Browser eine falsche video.duration UND
    video.currentTime bewegt sich beim Seek trotzdem weiter,
    obwohl gar kein echter Frame mehr dekodiert werden kann.
    Das äußert sich als schwarzer, eingefrorener Frame ohne
    jede Veränderung zum vorherigen Frame. Wird das erkannt
    (mehrere Frames hintereinander schwarz UND unverändert),
    gilt das echte Ende als erreicht; die betroffenen Frames
    werden aus dem Ergebnis entfernt.
  - Die tatsächlich nutzbare Videolänge wird zusätzlich über
    video.seekable ermittelt, falls verfügbar. Das liefert bei
    manchen fehlerhaften Dateien von vornherein einen
    genaueren Wert als video.duration.
  - SAMPLE_FPS von 30 auf 10 reduziert (siehe Kommentar unten).
  - Kontrast/Bewegung/Schnitt werden in einem gemeinsamen
    Pixel-Durchlauf berechnet statt in drei getrennten.
  - Wiederverwendete Puffer für den vorherigen Frame statt
    einer neuen Array-Allokation pro Frame.
  - Timeout beim Seek, damit die Analyse nicht endlos hängt,
    falls das "seeked"-Event einmal nicht feuert.
  - Abbrechen-Möglichkeit über den vorhandenen "Analyse
    starten"-Button (wechselt während der Analyse zu
    "Abbrechen").
  - Einfache Dateityp-Prüfung bei der Auswahl.
  - Seitenverhältnis wird beim Verkleinern auf die
    Analyseauflösung beibehalten (Letterboxing), damit das
    Bild nicht verzerrt wird.
  ------------------------------------------------------------
*/


const fileInput = document.getElementById("fileInput");
const video = document.getElementById("video");
const analyzeBtn = document.getElementById("analyzeBtn");
const clearBtn = document.getElementById("clearBtn");

const statusEl = document.getElementById("status");
const progressBar = document.getElementById("progressBar");

const avgContrastEl = document.getElementById("avgContrast");
const avgMotionEl = document.getElementById("avgMotion");
const cutCountEl = document.getElementById("cutCount");
const cutListEl = document.getElementById("cutList");

const chart = document.getElementById("chart");
const chartCtx = chart.getContext("2d");


/*
  Analyseauflösung.

  160 x 90 = 14.400 Pixel pro Frame.

  Das ist absichtlich klein, damit die Analyse
  auch auf Smartphones schnell bleibt.
*/
const ANALYSIS_WIDTH = 160;
const ANALYSIS_HEIGHT = 90;


/*
  Anzahl Frames pro Sekunde.

  10 FPS ist für Farb-/Bewegungs-/Schnittanalyse
  ein guter Kompromiss für mobile Geräte.

  Jeder Sample-Schritt braucht einen Seek im Video, und das
  ist der mit Abstand teuerste Teil der Analyse. Ein zu hoher
  Wert (z. B. 30) vervielfacht die Anzahl der Seeks, ohne dass
  Kontrast/Bewegung/Schnitte spürbar genauer erkannt werden.
*/
const SAMPLE_FPS = 30;


/*
  Timeout für einen einzelnen Seek-Vorgang.

  Falls das "seeked"-Event aus irgendeinem Grund nicht feuert,
  würde die Analyse sonst unbegrenzt hängen bleiben.
*/
const SEEK_TIMEOUT_MS = 3000;


/*
  Mindestens zwei aufeinanderfolgende Samples ohne
  Fortschritt der Videoposition, bevor die Analyse
  als "am Ende angekommen" gewertet wird.
*/
const STUCK_SAMPLES_LIMIT = 2;


/*
  Inhaltsbasierte Endeerkennung.

  Manche Videodateien haben eine video.duration, die länger
  ist als der tatsächlich dekodierbare Inhalt. In diesem Fall
  bewegt sich video.currentTime beim Seek zwar trotzdem weiter
  (die STUCK-Erkennung oben greift also nicht), es wird aber
  kein echter Frame mehr geliefert - stattdessen ein schwarzer,
  unveränderter Frame.

  Ein Frame gilt als "leer", wenn er nahezu schwarz ist UND
  sich praktisch nicht vom vorherigen Frame unterscheidet.
  Tritt das mehrfach hintereinander auf, ist das echte Ende
  erreicht.
*/

// Mittlere Luminanz (0-255), unterhalb derer ein Frame als
// "nahezu schwarz" gilt.
const BLANK_LUMINANCE_THRESHOLD = 10;

// Mittlere Pixeldifferenz zum vorherigen Frame, unterhalb
// derer ein Frame als "unverändert" gilt.
const BLANK_DIFF_THRESHOLD = 2;

// Anzahl aufeinanderfolgender "leerer" Frames, bevor die
// Analyse abgebrochen und der betroffene Bereich verworfen
// wird.
const BLANK_STREAK_LIMIT = 5;


/*
  Canvas für die Frameanalyse.
*/
const analysisCanvas = document.createElement("canvas");
analysisCanvas.width = ANALYSIS_WIDTH;
analysisCanvas.height = ANALYSIS_HEIGHT;

const analysisCtx = analysisCanvas.getContext("2d", {
  willReadFrequently: true
});


let videoURL = null;
let results = [];
let isAnalyzing = false;
let cancelRequested = false;
let analysisStartTime = 0;


/*
  Zwei wiederverwendete Puffer für den "vorherigen Frame".

  Statt bei jedem Frame ein neues Uint8ClampedArray zu
  allozieren, wird abwechselnd in diese beiden Puffer
  geschrieben.
*/
const FRAME_BUFFER_SIZE = ANALYSIS_WIDTH * ANALYSIS_HEIGHT * 4;
const frameBuffers = [
  new Uint8ClampedArray(FRAME_BUFFER_SIZE),
  new Uint8ClampedArray(FRAME_BUFFER_SIZE)
];

let previousFrame = null;
let nextBufferIndex = 0;


/*
  ------------------------------------------------------------
  Datei auswählen
  ------------------------------------------------------------
*/

fileInput.addEventListener("change", () => {

  const file = fileInput.files[0];

  if (!file) {
    return;
  }

  /*
    Einfache Prüfung, ob überhaupt eine Videodatei
    ausgewählt wurde.
  */

  if (file.type && !file.type.startsWith("video/")) {

    statusEl.textContent =
      "Bitte eine Videodatei auswählen.";

    fileInput.value = "";

    return;
  }

  if (videoURL) {
    URL.revokeObjectURL(videoURL);
  }

  videoURL = URL.createObjectURL(file);

  video.src = videoURL;

  analyzeBtn.disabled = false;
  clearBtn.disabled = false;

  statusEl.textContent =
    `${file.name} · ${(file.size / 1024 / 1024).toFixed(1)} MB`;

  progressBar.style.width = "0%";

  avgContrastEl.textContent = "–";
  avgMotionEl.textContent = "–";
  cutCountEl.textContent = "–";

  cutListEl.innerHTML =
    '<span style="color:#777">Noch keine Analyse.</span>';

  results = [];
  previousFrame = null;
  nextBufferIndex = 0;

  drawEmptyChart();
});


/*
  ------------------------------------------------------------
  Zurücksetzen
  ------------------------------------------------------------
*/

clearBtn.addEventListener("click", () => {

  if (isAnalyzing) {
    return;
  }

  if (videoURL) {
    URL.revokeObjectURL(videoURL);
    videoURL = null;
  }

  video.pause();
  video.removeAttribute("src");
  video.load();

  fileInput.value = "";

  analyzeBtn.disabled = true;
  clearBtn.disabled = true;

  results = [];
  previousFrame = null;
  nextBufferIndex = 0;

  statusEl.textContent =
    "Noch kein Video ausgewählt.";

  progressBar.style.width = "0%";

  avgContrastEl.textContent = "–";
  avgMotionEl.textContent = "–";
  cutCountEl.textContent = "–";

  cutListEl.innerHTML =
    '<span style="color:#777">Noch keine Analyse.</span>';

  drawEmptyChart();
});


/*
  ------------------------------------------------------------
  Analyse starten / abbrechen

  Derselbe Button startet die Analyse und dient während
  der Analyse als "Abbrechen"-Button.
  ------------------------------------------------------------
*/

analyzeBtn.addEventListener("click", async () => {

  /*
    Läuft bereits eine Analyse -> Klick bedeutet "abbrechen".
  */

  if (isAnalyzing) {

    cancelRequested = true;

    analyzeBtn.disabled = true;

    statusEl.textContent =
      "Analyse wird abgebrochen …";

    return;
  }


  if (!video.duration || !isFinite(video.duration)) {
    statusEl.textContent =
      "Video konnte noch nicht geladen werden.";
    return;
  }

  isAnalyzing = true;
  cancelRequested = false;

  analyzeBtn.textContent = "Abbrechen";
  clearBtn.disabled = true;

  analysisStartTime = performance.now();

  results = [];
  previousFrame = null;
  nextBufferIndex = 0;

  progressBar.style.width = "0%";

  statusEl.textContent =
    "Analyse wird vorbereitet …";


  try {

    await analyzeVideo();

    finishAnalysis(cancelRequested);

  } catch (error) {

    console.error(error);

    statusEl.textContent =
      "Fehler bei der Analyse.";

  } finally {

    isAnalyzing = false;
    cancelRequested = false;

    analyzeBtn.disabled = false;
    analyzeBtn.textContent = "Analyse starten";

    clearBtn.disabled = false;
  }
});


/*
  ------------------------------------------------------------
  Tatsächlich nutzbare Videolänge ermitteln
  ------------------------------------------------------------

  video.duration ist bei manchen Dateien (z. B. bestimmte
  Screen-Recordings oder Dateien mit variabler Framerate)
  ungenau. video.seekable liefert die Zeitbereiche, die der
  Browser tatsächlich ansteuern kann, und ist damit oft
  verlässlicher. Ist ein kleinerer seekable-Endwert vorhanden,
  wird dieser statt video.duration verwendet.
  ------------------------------------------------------------
*/

function getEffectiveDuration() {

  let effectiveDuration = video.duration;

  try {

    if (video.seekable && video.seekable.length > 0) {

      const seekableEnd =
        video.seekable.end(video.seekable.length - 1);

      if (
        isFinite(seekableEnd) &&
        seekableEnd > 0 &&
        seekableEnd < effectiveDuration
      ) {

        effectiveDuration = seekableEnd;
      }
    }

  } catch (error) {

    // video.seekable war nicht auswertbar - video.duration
    // als Fallback beibehalten.
  }

  return effectiveDuration;
}


/*
  ------------------------------------------------------------
  Videoanalyse
  ------------------------------------------------------------
*/

async function analyzeVideo() {

  const duration = getEffectiveDuration();

  /*
    Wir wählen die Anzahl der Samples anhand
    der Videolänge.

    Beispiel:

    20 Sekunden × 10 FPS = 200 Frames
  */

  const totalSamples =
    Math.max(
      1,
      Math.ceil(duration * SAMPLE_FPS)
    );


  let lastActualTime = -1;
  let stuckCount = 0;
  let blankStreak = 0;


  for (let i = 0; i < totalSamples; i++) {

    if (cancelRequested) {
      break;
    }

    const targetTime = i / SAMPLE_FPS;

    // Stoppen, wenn das Ende des Videos erreicht ist
    if (targetTime >= duration) {
      break;
    }

    await seekVideo(targetTime);

    /*
      Statt der rein rechnerischen targetTime verwenden wir
      die tatsächliche Position des Videos nach dem Seek.

      Das ist wichtig, weil video.duration bei manchen Dateien
      ungenau ist (z. B. Screen-Recordings, VFR-Videos). In dem
      Fall würde die Fortschrittsanzeige sonst nicht stimmen.
    */

    const time = video.currentTime;


    /*
      Wenn sich die Videoposition trotz Seek nicht mehr
      nennenswert bewegt, haben wir das tatsächliche Ende
      des Videos erreicht - auch wenn video.duration einen
      größeren Wert behauptet. Ohne diese Prüfung würde immer
      wieder derselbe letzte Frame analysiert werden, bis
      totalSamples erreicht ist (ungefähr doppelt so lange
      Analysezeit wie nötig).
    */

    if (time <= lastActualTime + 0.001) {

      stuckCount++;

      if (stuckCount >= STUCK_SAMPLES_LIMIT) {
        break;
      }

    } else {

      stuckCount = 0;
    }

    lastActualTime = time;


    /*
      Frame in kleines Canvas rendern.

      Das Seitenverhältnis des Videos wird dabei beibehalten
      (Letterboxing), damit die Statistikwerte nicht durch eine
      Verzerrung des Bildes verfälscht werden.
    */

    drawVideoFrameForAnalysis();


    const imageData =
      analysisCtx.getImageData(
        0,
        0,
        ANALYSIS_WIDTH,
        ANALYSIS_HEIGHT
      );


    /*
      Farbkontrast, Bewegung und Schnittscore werden in einem
      gemeinsamen Pixel-Durchlauf berechnet statt in drei
      getrennten Schleifen.
    */

    const frame =
      analyzeFrame(
        imageData.data,
        previousFrame
      );


    results.push({
      time,
      contrast: frame.contrast,
      motion: frame.motion,
      cutScore: frame.cutScore
    });


    /*
      Inhaltsbasierte Endeerkennung.

      Ein Frame gilt als "leer", wenn er nahezu schwarz ist
      und sich praktisch nicht vom vorherigen Frame
      unterscheidet. previousFrame ist beim allerersten Frame
      noch null - in dem Fall wird nicht gewertet, da noch
      kein Vergleich möglich ist.
    */

    const isBlankFrame =
      previousFrame !== null &&
      frame.meanLuminance < BLANK_LUMINANCE_THRESHOLD &&
      frame.pixelDiff < BLANK_DIFF_THRESHOLD;

    if (isBlankFrame) {

      blankStreak++;

    } else {

      blankStreak = 0;
    }


    /*
      Aktuelles Frame für den nächsten Vergleich speichern.

      Statt jedes Mal ein neues Array zu allozieren, wird
      abwechselnd in einen von zwei wiederverwendeten Puffern
      geschrieben.
    */

    const buffer = frameBuffers[nextBufferIndex];
    buffer.set(imageData.data);
    previousFrame = buffer;
    nextBufferIndex = 1 - nextBufferIndex;


    if (blankStreak >= BLANK_STREAK_LIMIT) {

      /*
        Die letzten blankStreak Frames waren schwarz und
        unverändert - das ist kein echter Videoinhalt,
        sondern das Resultat eines Seeks über das
        tatsächliche Ende hinaus. Diese Frames werden aus
        dem Ergebnis entfernt, bevor die Analyse beendet
        wird.
      */

      results.splice(
        results.length - blankStreak,
        blankStreak
      );

      break;
    }


    /*
      Fortschrittsanzeige.

      Basierend auf der Anzahl der Samples statt auf
      time / duration, damit eine ungenaue video.duration
      die Anzeige nicht verfälscht.
    */

    const progress = Math.min(100, ((i + 1) / totalSamples) * 100);

    progressBar.style.width = progress.toFixed(1) + "%";
    statusEl.textContent = `Analyse ${Math.round(progress)} %`;


    /*
      Browser kurz Luft lassen.

      Besonders wichtig auf Smartphones,
      damit die Oberfläche nicht komplett einfriert.
    */

    if (i % 4 === 0) {
      await nextFrame();
    }
  }

  if (!cancelRequested) {
    progressBar.style.width = "100%";
    statusEl.textContent = "Analyse 100 %";
  }
}


/*
  ------------------------------------------------------------
  Frame in das Analyse-Canvas zeichnen

  Das Video wird unter Beibehaltung seines Seitenverhältnisses
  in die feste Analyseauflösung eingepasst (Letterboxing /
  Pillarboxing), statt es zu strecken. Nicht abgedeckte Ränder
  werden schwarz gefüllt.
  ------------------------------------------------------------
*/

function drawVideoFrameForAnalysis() {

  const videoWidth = video.videoWidth || ANALYSIS_WIDTH;
  const videoHeight = video.videoHeight || ANALYSIS_HEIGHT;

  const canvasAspect = ANALYSIS_WIDTH / ANALYSIS_HEIGHT;
  const videoAspect = videoWidth / videoHeight;

  let drawWidth;
  let drawHeight;

  if (videoAspect > canvasAspect) {

    // Video ist relativ breiter als die Analyseauflösung.
    drawWidth = ANALYSIS_WIDTH;
    drawHeight = ANALYSIS_WIDTH / videoAspect;

  } else {

    // Video ist relativ höher (oder gleiches Verhältnis).
    drawHeight = ANALYSIS_HEIGHT;
    drawWidth = ANALYSIS_HEIGHT * videoAspect;
  }

  const offsetX = (ANALYSIS_WIDTH - drawWidth) / 2;
  const offsetY = (ANALYSIS_HEIGHT - drawHeight) / 2;

  analysisCtx.fillStyle = "#000";
  analysisCtx.fillRect(0, 0, ANALYSIS_WIDTH, ANALYSIS_HEIGHT);

  analysisCtx.drawImage(
    video,
    offsetX,
    offsetY,
    drawWidth,
    drawHeight
  );
}


/*
  ------------------------------------------------------------
  Video auf bestimmte Zeit setzen
  ------------------------------------------------------------
*/

function seekVideo(time, timeoutMs = SEEK_TIMEOUT_MS) {

  return new Promise((resolve, reject) => {

    let settled = false;

    const onSeeked = () => {

      if (settled) {
        return;
      }

      settled = true;
      cleanup();
      resolve();
    };

    const onError = () => {

      if (settled) {
        return;
      }

      settled = true;
      cleanup();
      reject(
        new Error("Video konnte nicht gelesen werden.")
      );
    };

    const timeoutId = setTimeout(() => {

      if (settled) {
        return;
      }

      settled = true;
      cleanup();
      reject(
        new Error("Zeitüberschreitung beim Springen im Video.")
      );

    }, timeoutMs);

    function cleanup() {

      clearTimeout(timeoutId);

      video.removeEventListener(
        "seeked",
        onSeeked
      );

      video.removeEventListener(
        "error",
        onError
      );
    }

    video.addEventListener(
      "seeked",
      onSeeked,
      { once: true }
    );

    video.addEventListener(
      "error",
      onError,
      { once: true }
    );

    video.currentTime = time;

  });

}


/*
  ------------------------------------------------------------
  Frame-Analyse: Farbkontrast, Bewegung und Schnittscore

  Alle drei Werte werden in einem gemeinsamen Durchlauf über
  die Pixel berechnet (statt in drei getrennten Schleifen wie
  zuvor). Die verwendeten Formeln sind unverändert:

  - Kontrast = normalisierte Standardabweichung der Luminanz
    (Varianz wird einstufig über E[X²] − E[X]² bestimmt).
  - Bewegung = normalisierte mittlere Luminanzdifferenz zum
    vorherigen Frame.
  - Schnittscore = gewichtete Kombination aus mittlerer
    RGB-Differenz zum vorherigen Frame und der Bewegung.
  ------------------------------------------------------------
*/

function analyzeFrame(data, previousData) {

  const hasPrevious = !!previousData;

  let lumSum = 0;
  let lumSumSq = 0;

  let motionDiffSum = 0;
  let cutDiffSum = 0;

  let count = 0;


  for (let i = 0; i < data.length; i += 4) {

    const r = data[i];
    const g = data[i + 1];
    const b = data[i + 2];

    const luminance =
      0.2126 * r +
      0.7152 * g +
      0.0722 * b;

    lumSum += luminance;
    lumSumSq += luminance * luminance;

    count++;


    if (hasPrevious) {

      const pr = previousData[i];
      const pg = previousData[i + 1];
      const pb = previousData[i + 2];

      const previousLuminance =
        0.2126 * pr +
        0.7152 * pg +
        0.0722 * pb;

      motionDiffSum +=
        Math.abs(luminance - previousLuminance);

      cutDiffSum +=
        (
          Math.abs(r - pr) +
          Math.abs(g - pg) +
          Math.abs(b - pb)
        ) / 3;
    }
  }


  /*
    Farbkontrast.

    Typische Werte liegen grob zwischen 0 und 100.
    64 wird hier als sehr hoher Kontrast angenommen.
  */

  const mean = lumSum / count;

  const variance =
    Math.max(0, (lumSumSq / count) - (mean * mean));

  const std = Math.sqrt(variance);

  const contrast =
    clamp((std / 64) * 100, 0, 100);


  if (!hasPrevious) {

    return {
      contrast,
      motion: 0,
      cutScore: 0,
      meanLuminance: mean,
      pixelDiff: 0
    };
  }


  /*
    Bewegung.

    25 Helligkeitsstufen Unterschied
    werden als sehr starke Bewegung betrachtet.
  */

  const averageMotionDifference =
    motionDiffSum / count;

  const motion =
    clamp((averageMotionDifference / 25) * 100, 0, 100);


  /*
    Schnittscore.

    50 durchschnittliche RGB-Stufen
    entsprechen einem sehr starken Unterschied.

    Bewegung alleine soll keinen Schnitt erzeugen, deshalb
    wird der visuelle Sprung stärker gewichtet als die
    Bewegung.
  */

  const averageCutDifference =
    cutDiffSum / count;

  const pixelScore =
    clamp((averageCutDifference / 50) * 100, 0, 100);

  const cutScore =
    clamp(
      pixelScore * 0.85 + Math.min(motion, 70) * 0.15,
      0,
      100
    );


  return {
    contrast,
    motion,
    cutScore,
    meanLuminance: mean,
    pixelDiff: averageCutDifference
  };
}


/*
  ------------------------------------------------------------
  Analyse fertigstellen
  ------------------------------------------------------------
*/

function finishAnalysis(wasCancelled) {

  if (!results.length) {

    if (wasCancelled) {
      statusEl.textContent = "Analyse abgebrochen.";
    }

    return;
  }


  /*
    Durchschnittswerte.
  */

  const avgContrast =
    average(
      results.map(r => r.contrast)
    );

  const avgMotion =
    average(
      results.map(r => r.motion)
    );


  avgContrastEl.textContent =
    Math.round(avgContrast);

  avgMotionEl.textContent =
    Math.round(avgMotion);


  /*
    Schnitte erkennen.
  */

  const cuts =
    detectCuts(results);


  cutCountEl.textContent =
    cuts.length;


  renderCutList(cuts);

  drawChart(results, cuts);


  const analysisTime = (performance.now() - analysisStartTime) / 1000;
  const formattedTime = analysisTime.toFixed(1).replace(".", ",");

  if (wasCancelled) {

    statusEl.textContent =
      `Analyse abgebrochen · ${results.length} Frames untersucht. Dauer: ${formattedTime} Sekunden`;

  } else {

    statusEl.textContent =
      `Analyse abgeschlossen · ${results.length} Frames untersucht. Analysezeit: ${formattedTime} Sekunden`;
  }
}


/*
  ------------------------------------------------------------
  Schnitte erkennen
  ------------------------------------------------------------

  Wir verwenden nicht nur einen einzelnen Frame.

  Zusätzlich gibt es eine Mindestdistanz zwischen
  zwei Schnitten, damit ein einziger Übergang
  nicht mehrfach erkannt wird.
  ------------------------------------------------------------
*/

function detectCuts(data) {

  const cuts = [];

  /*
    Score-Schwelle.

    Kann später kalibriert werden.
  */

  const THRESHOLD = 72;


  /*
    Mindestens 0.35 Sekunden zwischen Schnitten.
  */

  const MIN_DISTANCE = 0.35;


  let lastCutTime = -Infinity;


  for (let i = 1; i < data.length - 1; i++) {

    const current =
      data[i];

    const previous =
      data[i - 1];

    const next =
      data[i + 1];


    /*
      Lokales Maximum.

      Dadurch wird nicht jeder Frame
      eines längeren Übergangs als Cut erkannt.
    */

    const isPeak =
      current.cutScore >= previous.cutScore &&
      current.cutScore >= next.cutScore;


    if (
      isPeak &&
      current.cutScore >= THRESHOLD &&
      current.time - lastCutTime >= MIN_DISTANCE
    ) {

      cuts.push({
        time: current.time,
        score: current.cutScore
      });

      lastCutTime =
        current.time;
    }
  }


  return cuts;
}


/*
  ------------------------------------------------------------
  Schnittliste darstellen
  ------------------------------------------------------------
*/

function renderCutList(cuts) {

  if (!cuts.length) {

    cutListEl.innerHTML =
      '<span style="color:#777">Keine deutlichen Schnitte erkannt.</span>';

    return;
  }


  cutListEl.innerHTML = "";


  cuts.forEach(cut => {

    const element =
      document.createElement("div");

    element.className =
      "cut";


    element.textContent =
      `${formatTime(cut.time)} · ${Math.round(cut.score)}%`;


    /*
      Klick auf Schnitt springt im Video dorthin.
    */

    element.addEventListener("click", () => {

      video.currentTime =
        cut.time;

      video.play().catch(() => {});

    });


    element.style.cursor =
      "pointer";


    cutListEl.appendChild(element);

  });
}


/*
  ------------------------------------------------------------
  Chart
  ------------------------------------------------------------
*/

function prepareChartCanvas() {

  const rect =
    chart.getBoundingClientRect();

  const dpr =
    window.devicePixelRatio || 1;


  chart.width =
    Math.round(rect.width * dpr);

  chart.height =
    Math.round(rect.height * dpr);


  chartCtx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );


  return {
    width: rect.width,
    height: rect.height
  };
}


function drawEmptyChart() {

  const {
    width,
    height
  } = prepareChartCanvas();


  chartCtx.clearRect(
    0,
    0,
    width,
    height
  );


  chartCtx.strokeStyle =
    "#333";

  chartCtx.lineWidth =
    1;


  for (let i = 0; i <= 4; i++) {

    const y =
      (height / 4) * i;

    chartCtx.beginPath();

    chartCtx.moveTo(
      0,
      y
    );

    chartCtx.lineTo(
      width,
      y
    );

    chartCtx.stroke();
  }
}


function drawChart(data, cuts) {

  const {
    width,
    height
  } = prepareChartCanvas();


  chartCtx.clearRect(
    0,
    0,
    width,
    height
  );


  /*
    Hintergrundlinien.
  */

  chartCtx.strokeStyle =
    "#292929";

  chartCtx.lineWidth =
    1;


  for (let i = 0; i <= 4; i++) {

    const y =
      (height / 4) * i;

    chartCtx.beginPath();

    chartCtx.moveTo(
      0,
      y
    );

    chartCtx.lineTo(
      width,
      y
    );

    chartCtx.stroke();
  }


  /*
    Funktion zum Zeichnen einer Kurve.
  */

  function drawLine(
    key,
    lineWidth,
    color
  ) {

    chartCtx.beginPath();

    chartCtx.lineWidth = lineWidth;

    chartCtx.strokeStyle = color;


    data.forEach((item, index) => {

      const x =
        (item.time / data[data.length - 1].time)
        * width;

      const y =
        height -
        (item[key] / 100) * height;


      if (index === 0) {
        chartCtx.moveTo(x, y);
      } else {
        chartCtx.lineTo(x, y);
      }

    });

    chartCtx.stroke();
  }


  /*
    Kontrast
  */

  chartCtx.setLineDash([]);

  drawLine(
    "contrast",
    2,
    "#4CAF50"
  );


  /*
    Bewegung gestrichelt
  */

  chartCtx.setLineDash([
    5,
    4
  ]);

  drawLine(
    "motion",
    2,
    "#2196F3"
  );


  /*
    Schnittscore gepunktet.
  */
/*
  chartCtx.setLineDash([
    2,
    5
  ]);

  drawLine(
    "cutScore",
    1,
    "#FF5252"
  );


  chartCtx.setLineDash([]);
*/

  /*
    Schnittmarkierungen.
  */

  chartCtx.strokeStyle =
    "#FF5252";

  
  chartCtx.lineWidth = 2;


  cuts.forEach(cut => {

    const x =
      (cut.time / data[data.length - 1].time)
      * width;


    chartCtx.beginPath();

    chartCtx.moveTo(
      x,
      0
    );

    chartCtx.lineTo(
      x,
      height
    );

    chartCtx.stroke();

  });
}


/*
  Fenstergröße geändert.
*/

window.addEventListener(
  "resize",
  () => {

    if (results.length) {

      drawChart(
        results,
        detectCuts(results)
      );

    } else {

      drawEmptyChart();

    }

  }
);


/*
  ------------------------------------------------------------
  Hilfsfunktionen
  ------------------------------------------------------------
*/

function clamp(
  value,
  min,
  max
) {

  return Math.max(
    min,
    Math.min(max, value)
  );
}


function average(values) {

  if (!values.length) {
    return 0;
  }

  return values.reduce(
    (sum, value) => sum + value,
    0
  ) / values.length;
}


function formatTime(seconds) {

  const minutes =
    Math.floor(seconds / 60);

  const secs =
    Math.floor(seconds % 60);

  return (
    String(minutes).padStart(2, "0") +
    ":" +
    String(secs).padStart(2, "0")
  );
}


function nextFrame() {

  return new Promise(resolve => {

    if ("requestIdleCallback" in window) {

      requestIdleCallback(
        () => resolve(),
        { timeout: 50 }
      );

    } else {

      setTimeout(
        resolve,
        0
      );

    }

  });
}


/*
  Initialer Chart.
*/

drawEmptyChart();

</script>
